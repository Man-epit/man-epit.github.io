summary:
  en: "Photorealistic images computed from scratch on the CPU: light rays bounce, reflect and bend through glass in scenes described in a text file, with new shapes and lights added as plugins without recompiling, and the image sharpening progressively on screen while every core works on it."
  fr: "Des images photoréalistes calculées de zéro sur le CPU : les rayons de lumière rebondissent, se reflètent et se courbent à travers le verre dans des scènes décrites dans un fichier texte, avec de nouvelles formes et lumières ajoutées en plugins sans recompiler, et l'image qui s'affine progressivement à l'écran pendant que tous les cœurs travaillent."
