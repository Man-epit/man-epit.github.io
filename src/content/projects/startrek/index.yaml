  fr: Projet Epitech, 2e année
contextText:
  en: LunarLander counts as solved at an average return of 200. The goal was to get there with a DQN written from scratch and to prove the result holds across random seeds.
  fr: LunarLander est considéré comme résolu à partir d'un retour moyen de 200. L'objectif était d'y arriver avec un DQN écrit de zéro et de prouver que le résultat tient sur plusieurs seeds.
contributions:
  en:
    - DQN implementation written from scratch in PyTorch
    - YAML configs to run experiments reproducibly
    - Baselines and multi-seed runs to compare results fairly
    - Learning curves plotted with Matplotlib
  fr:
    - Implémentation d'un DQN écrite de zéro en PyTorch
    - Configs YAML pour des expériences reproductibles
    - Baselines et exécutions multi-seeds pour comparer honnêtement
    - Courbes d'apprentissage tracées avec Matplotlib
