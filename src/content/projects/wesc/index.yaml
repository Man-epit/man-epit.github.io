summary:
  en: "To make our self-driving car react faster, we stopped relying on the standard tools and wrote our own library to talk to its motor controller. Small, written in C, and open source soon."
  fr: "Pour que notre voiture autonome réagisse plus vite, nous avons laissé de côté les outils standards et écrit notre propre bibliothèque pour dialoguer avec son contrôleur moteur. Légère, écrite en C, et bientôt open source."
team:
  en: 4 people
  fr: 4 personnes
context:
  en: Epitech RoboCar programme
  fr: Programme RoboCar d'Epitech
contextText:
  en: "Built inside the RoboCar project (a UTAC challenge, one team per Epitech campus). Every driving decision of the car goes through this library, so its latency matters."
  fr: "Développée dans le cadre du projet RoboCar (un défi de l'UTAC, une équipe par campus Epitech). Chaque décision de conduite de la voiture passe par cette bibliothèque, sa latence compte donc."
contributions:
  en:
    - "Packet framing (start byte, length, payload, CRC-16, stop byte) and one encoder per command"
    - Telemetry decoding (temperatures, currents, RPM, voltage, fault codes) with strict framing and CRC checks
    - Errors reported through errno, so the calling program can recover instead of crashing
  fr:
    - "Mise en trame des paquets (octet de début, longueur, données, CRC-16, octet de fin) et un encodeur par commande"
    - Décodage de la télémétrie (températures, courants, RPM, tension, codes de défaut) avec vérification stricte de la trame et du CRC
    - Erreurs remontées via errno, pour que le programme appelant puisse réagir au lieu de planter
