  fr: Projet de fin de 1re année
contextText:
  en: Epitech's end-of-1st-year project, based on the 1984 programming game where programs fight for control of shared memory.
  fr: Projet de fin de 1re année d'Epitech, inspiré du jeu de programmation de 1984 où des programmes se battent pour le contrôle d'une mémoire partagée.
contributions:
  en:
    - Circular 6 KiB memory arena and champion loader
    - All 16 instructions with their cycle costs, including process fork
    - "Bonus: a shell to control the simulation step by step and print any value at any time"
    - "Bonus: a live 3D view of the memory in OpenGL (GLFW)"
    - "Bonus: a VR mode, where the virtual machine acts as a server and a Unity client renders the battle in the headset"
    - "Companion assembler: robot_factory"
  fr:
    - Arène mémoire circulaire de 6 Kio et chargement des champions
    - Les 16 instructions avec leur coût en cycles, fork de processus compris
    - "Bonus : un shell pour contrôler la simulation pas à pas et afficher n'importe quelle valeur à tout moment"
    - "Bonus : une vue 3D en direct de la mémoire en OpenGL (GLFW)"
    - "Bonus : un mode VR, où la machine virtuelle sert de serveur et un client Unity affiche le combat dans le casque"
    - "Assembleur associé : robot_factory"
