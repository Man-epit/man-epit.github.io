summary:
  en: "Can a model spot a stroke on a brain scan, or recognise an illness from how patients describe it? Two medical studies: a classifier that tells normal scans, bleeding and ischemic strokes apart on CT scans (89% accuracy), and an unsupervised model that groups a thousand patient testimonies into 12 pathologies."
  fr: "Un modèle peut-il repérer un AVC sur un scanner, ou reconnaître une maladie à la façon dont les patients la décrivent ? Deux études médicales : un classifieur qui distingue scanners normaux, hémorragies et AVC ischémiques (89 % de précision), et un modèle non supervisé qui regroupe un millier de témoignages de patients en 12 pathologies."
team:
  en: 2 people
  fr: 2 personnes
context:
  en: Epitech project, 2nd year
  fr: Projet Epitech, 2e année
