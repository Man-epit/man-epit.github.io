summary:
  en: "A networked simulation where autonomous AI agents live, cooperate and evolve in a shared world. We designed the whole architecture around a strict protocol: a C++ server running the simulation, an OpenGL client to watch it and AI agents acting in it, then a bridge that opened the same world to a VR headset in augmented reality, a web app and LLM-driven agents with their own personalities."
  fr: "Une simulation en réseau où des agents IA autonomes vivent, coopèrent et évoluent dans un monde partagé. Nous avons conçu toute l'architecture autour d'un protocole strict : un serveur C++ qui fait tourner la simulation, un client OpenGL pour l'observer et des agents IA qui y agissent, puis un bridge qui a ouvert ce même monde à un casque VR en réalité augmentée, à une application web et à des agents pilotés par des LLM, chacun avec sa personnalité."
role: ""
