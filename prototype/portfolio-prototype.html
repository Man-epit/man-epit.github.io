<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#122230; --muted:#5A6B78; --line:#D5DCE2;
  --accent:#0A6C8C; --accent-soft:#DCEEF4; --accent-ink:#FFFFFF;
  --warm:#B8591A; --warm-soft:#FBE9DC; --ph:#E7ECF0; --ph-line:#AEBBC6;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --wrap:1080px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D161D; --surface:#15212A; --ink:#E6EDF2; --muted:#93A4B1; --line:#26343F;
    --accent:#4FB3D3; --accent-soft:#12303C; --accent-ink:#06131A;
    --warm:#F0954F; --warm-soft:#3A2415; --ph:#18252F; --ph-line:#3C4F5D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D161D; --surface:#15212A; --ink:#E6EDF2; --muted:#93A4B1; --line:#26343F;
  --accent:#4FB3D3; --accent-soft:#12303C; --accent-ink:#06131A;
  --warm:#F0954F; --warm-soft:#3A2415; --ph:#18252F; --ph-line:#3C4F5D;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
.wrap{max-width:var(--wrap);margin-inline:auto}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
.brand{font-family:var(--display);font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);letter-spacing:.01em}
.brand span{color:var(--accent)}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav a.l{display:block;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
.nav a.l:hover{color:var(--ink);background:var(--surface)}
.nav a.l[aria-current="page"]{color:var(--ink)}
@media (max-width:560px){.nav .hide-sm{display:none}}

/* hero */
.hero{padding-block:56px 40px;display:grid;grid-template-columns:1.35fr 1fr;gap:40px;align-items:center}
.coords{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.avail{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 12px 4px 10px;font-size:13px;font-weight:600}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,58px);letter-spacing:-.02em}
.hero h1 .sep{color:var(--accent)}
.hero .pitch{font-size:19px;color:var(--muted);max-width:34ch;margin-top:16px}
.hero .pitch b{color:var(--ink);font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
.scope{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.scope svg{width:100%;height:auto;display:block}
.scope .grid line{stroke:var(--line);stroke-width:1}
.scope .trace{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.scope .read{display:flex;justify-content:space-between;margin-top:10px;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.scope .trace{stroke-dasharray:900;animation:draw 2.4s ease-out both}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-block:36px 28px}}

/* sections */
section.block{padding-block:56px 8px}
.shead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.shead h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,28px);letter-spacing:-.01em}
.shead a{font-weight:600;font-size:14px;text-decoration:none}

/* media placeholder */
.ph{background:var(--ph);border:1.5px dashed var(--ph-line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;color:var(--muted);aspect-ratio:16/9;max-width:100%;width:100%}
.ph .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:4px}
.ph .d{font-size:13px;max-width:36ch;line-height:1.4}
.ph.sq{aspect-ratio:1/1}
.ph.tall{aspect-ratio:4/5}

/* cards */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.feat{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.feat{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-2px)}}
.card .body{padding:2px 4px 6px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-family:var(--body);font-weight:700;font-size:19px}
.card p{color:var(--muted);font-size:15px;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.award{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--warm);background:var(--warm-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}

/* timeline */
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .it{position:relative;padding:0 0 26px 24px;display:grid;grid-template-columns:170px 1fr;gap:20px}
.tl .it::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tl .when{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.tl h3{font-size:18px;font-weight:700;font-family:var(--body)}
.tl h3 small{font-weight:500;color:var(--muted);font-size:15px}
.tl ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.tl ul li b{color:var(--ink)}
@media (max-width:640px){.tl .it{grid-template-columns:1fr;gap:4px}}

.kind{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:4px;margin-bottom:4px;border:1px solid var(--line);color:var(--muted)}
.kind.work{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
/* events */
.ev{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:700px){.ev{grid-template-columns:1fr}}
.evc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.evc:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.evc:hover{transform:translateY(-2px)}}
.evc .ph{aspect-ratio:1/1;padding:6px}
.evc .ph .d{display:none}
.evc h3{font-size:17px;font-family:var(--body);font-weight:700}
.evc p{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.evc .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:860px){.skills{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.skills{grid-template-columns:1fr}}
.sk{border-top:2px solid var(--accent);padding-top:12px}
.sk h3{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted);margin-bottom:10px}
.sk ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.sk li{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px}

/* two col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{font-size:17px;font-weight:700;font-family:var(--body)}
.panel .role{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel p{color:var(--muted);margin-top:6px;font-size:15px}
.panel + .panel{margin-top:0}
.press{list-style:none;padding:0;margin:0;display:grid;gap:0}
.press li{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.press li:first-child{border-top:0;padding-top:0}
.press a{font-weight:600;text-decoration:none;color:var(--ink)}
.press a:hover{color:var(--accent)}

/* contact */
.contact{margin-block:56px 40px;background:var(--ink);color:var(--bg);border-radius:14px;padding:36px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.contact h2{font-family:var(--display);font-size:clamp(22px,3.4vw,32px);font-weight:700}
.contact p{opacity:.8;margin-top:10px;max-width:46ch}
.contact .rows{display:grid;gap:10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.crow .v{font-family:var(--mono);font-size:14px;user-select:all;word-break:break-all}
.crow a{color:var(--bg);font-weight:600;font-size:14px}
.crow button{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:6px;padding:4px 10px;font:600 13px var(--body);cursor:pointer}
@media (max-width:760px){.contact{grid-template-columns:1fr;padding:24px}}
footer{padding-block:0 32px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* projects index */
.phead{padding-block:44px 20px}
.phead h1{font-family:var(--display);font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.02em}
.phead p{color:var(--muted);margin-top:10px;max-width:60ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-block:18px 22px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font:500 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.65;margin-left:4px}
.plist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.plist{grid-template-columns:repeat(2,1fr)}}
@media (max-width:540px){.plist{grid-template-columns:1fr}}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px}
.prow:hover{border-color:var(--accent)}
.prow .nm{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ink)}
.prow .ds{font-size:14px;color:var(--muted);line-height:1.45}
.todo{color:var(--warm);font-style:italic}

/* project detail */
.crumb{padding-top:28px;font-size:14px}
.crumb a{text-decoration:none;font-weight:600}
.dhead{padding-block:14px 22px;display:grid;gap:14px}
.dhead h1{font-family:var(--display);font-size:clamp(28px,5.2vw,46px);font-weight:700;letter-spacing:-.02em}
.dhead .sum{font-size:19px;color:var(--muted);max-width:60ch}
.specs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-block:6px 26px}
.specs > div{padding:12px 14px;border-left:1px solid var(--line)}
.specs > div:first-child{border-left:0}
.specs .v{font-weight:600;font-size:15px;margin-top:2px}
@media (max-width:700px){.specs{grid-template-columns:repeat(2,1fr)}.specs > div:nth-child(3){border-left:0}.specs > div:nth-child(n+3){border-top:1px solid var(--line)}}
.dgrid{display:grid;grid-template-columns:1fr 300px;gap:40px;margin-top:34px}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.prose{display:grid;gap:30px;max-width:66ch}
.prose h2{font-family:var(--display);font-size:19px;font-weight:700;margin-bottom:10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.results div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.results strong{display:block;font-family:var(--display);font-size:20px;color:var(--accent)}
.results span{font-size:14px;color:var(--muted)}
.side{display:grid;gap:18px;align-content:start}
.side .panel h3{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.side ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.side li a{font-weight:600;text-decoration:none}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media (max-width:640px){.gallery{grid-template-columns:repeat(2,1fr)}}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:48px;padding-top:20px;padding-bottom:40px;flex-wrap:wrap}
.pager a{text-decoration:none;display:grid;gap:2px;max-width:48%}
.pager a b{color:var(--ink);font-size:16px}
.pager a:last-child{text-align:right;margin-left:auto}
.devnote{margin-top:28px;font-size:13px;color:var(--muted);border:1px dashed var(--ph-line);border-radius:8px;padding:10px 12px}
.devnote code{font-family:var(--mono);font-size:12.5px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:6px}
.lang button{background:transparent;border:0;padding:5px 9px;font:600 12px var(--mono);color:var(--muted);cursor:pointer;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav-r{display:flex;align-items:center;gap:4px}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{font-family:var(--mono);font-size:14px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--surface)}
.rel a:hover{border-color:var(--accent)}
</style>

function media(m, cls=""){
  if (m && m.src) {
    if (m.type==="video") return `<video class="${cls}" src="${esc(m.src)}" controls muted playsinline style="width:100%;border-radius:8px"></video>`;
    return `<img class="${cls}" src="${esc(m.src)}" alt="${esc(L(m.caption))}" style="width:100%;border-radius:8px">`;
  }
  const kind = (m?.type||"image")==="video" ? T().video : T().image;
  return `<div class="ph ${cls}"><span class="k">${kind}</span><span class="d">${esc(L(m?.caption)||T().mediaHere)}</span></div>`;
}

function scope(){
  let d="M0 60";
  for(let x=0;x<=600;x+=6){
    let y;
    if(x<150) y=60+Math.sin(x*.21)*6+Math.sin(x*.07)*4;
    else if(x<450) y=((Math.floor((x-150)/50))%2===0)?28:92;
    else y=60+Math.sin(x*.15)*22*Math.exp(-(x-450)/60);
    d+=` L${x} ${y.toFixed(1)}`;
  }
  const g=[...Array(7)].map((_,i)=>`<line x1="${i*100}" y1="0" x2="${i*100}" y2="120"/>`).join("")+[...Array(5)].map((_,i)=>`<line x1="0" y1="${i*30}" x2="600" y2="${i*30}"/>`).join("");
  return `<div class="scope" aria-hidden="true">
    <svg viewBox="0 0 600 120"><g class="grid">${g}</g><path class="trace" d="${d}"/></svg>
    <div class="read"><span class="label">CH1 · UART 115200 baud</span><span class="label">${esc(PROFILE.coords)}</span></div>
  </div>`;
}

      ${show("did", contrib.length) ? `<div><h2>${t.did}</h2>${contrib.length?`<ul>${contrib.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p>${todo(t.didTodo)}</p>`}</div>` : ""}
      ${show("results", p.results?.length) ? `<div><h2>${t.results}</h2>${p.results?.length?`<div class="results">${p.results.map(r=>`<div><strong>${esc(L(r.v))}</strong><span>${esc(L(r.l))}</span></div>`).join("")}</div>`:`<p>${todo(t.resTodo)}</p>`}</div>` : ""}
      ${show("gallery", m.length>1) ? `<div><h2>${t.gallery}</h2><div class="gallery">${(m.length>1?m.slice(1):t.shots).map(x=>media(x,"sq")).join("")}</div></div>` : ""}
      ${show("learned", L(p.learned)) ? `<div><h2>${t.learned}</h2><p>${L(p.learned)?esc(L(p.learned)):todo(t.learnTodo)}</p></div>` : ""}
    </div>
    <aside class="side">
      ${show("links", (p.links||[]).some(l=>l.url)) ? `<div class="panel"><h3>${t.links}</h3><ul>${links||`<li>${todo(t.noLinks)}</li>`}</ul></div>` : ""}
      ${show("stack", p.tags?.length) ? `<div class="panel"><h3>${t.stack}</h3><div class="tags" style="padding:0">${tags(p.tags)||todo(t.toFill)}</div></div>` : ""}
      ${rel.length && !(p.hide||[]).includes("related") ? `<div class="panel"><h3>${t.related}</h3><div class="rel">${rel.map(r=>`<a href="#project-${esc(r.slug)}">${esc(L(r.title))}</a>`).join("")}</div></div>` : ""}
    </aside>
  </div>
  ${SITE.draft ? `<p class="devnote">${t.devnote}</p>` : ""}
  <nav class="pager" aria-label="${esc(c.back[1])}">
    <a href="#${c.prefix}${esc(prev.slug)}"><span class="label">${t.prev}</span><b>${esc(L(prev.title))}</b></a>
    <a href="#${c.prefix}${esc(next.slug)}"><span class="label">${t.next}</span><b>${esc(L(next.title))}</b></a>
  </nav>`;
}

function nav(page){
  const t = T();
  const items = [["home",t.home,""],["projects",t.projects,""],["events",t.hackathons,"hide-sm"],["contact",t.contact,""]];
  document.getElementById("navlinks").innerHTML = items.map(([h,label,cls])=>
    `<li class="${cls}"><a class="l" href="#${h}" ${h===page?'aria-current="page"':""}>${label}</a></li>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.l===lang)));
  document.documentElement.lang = lang;
}

function route(keepScroll){
  const h = location.hash.replace("#","") || "home";
  let page = "home", html;
  if (h==="projects"){ page="projects"; html=projectsPage(); }
  else if (h.startsWith("project-")){ page="projects"; html=projectPage(h.slice(8)); }
  else if (h.startsWith("event-")){ page="events"; html=eventPage(h.slice(6)); }
  else html = home();
  $app.innerHTML = html + `<footer><span>© 2026 ${esc(PROFILE.name)}</span><span class="mono">${esc(PROFILE.location)} · ${esc(PROFILE.coords)}</span></footer>`;
  nav(page);
  if (!keepScroll){
    if (page==="home" && HOME_ANCHORS.includes(h)) requestAnimationFrame(()=>document.getElementById(h)?.scrollIntoView());
    else window.scrollTo(0,0);
  }
  wire();
}

function wire(){
  document.getElementById("copy")?.addEventListener("click", async e=>{
    const b=e.currentTarget, t=T();
    try{ await navigator.clipboard.writeText(PROFILE.email); b.textContent=t.copied; }
    catch{ const r=document.createRange(); r.selectNodeContents(document.getElementById("mail")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent=t.selected; }
    setTimeout(()=>b.textContent=T().copy,1600);
  });
  document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    activeCat = ch.dataset.c;
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", String(c===ch)));
    document.querySelectorAll("#plist .prow").forEach(r=>r.hidden = !(activeCat==="all"||r.dataset.c===activeCat));
  }));
}

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  lang = b.dataset.l;
  try { localStorage.setItem("lang", lang); } catch {}
  route(true);
}));
addEventListener("hashchange", ()=>route(false));
route(false);
</script>
