summary:
  en: "A pizzeria that runs like a distributed system: the reception takes orders and opens new kitchens as separate processes when the load grows, each kitchen runs its cooks as threads sharing a refilling stock, and everything talks over named pipes with our own binary protocol."
  fr: "Une pizzeria qui fonctionne comme un système distribué : l'accueil prend les commandes et ouvre de nouvelles cuisines, chacune dans son propre processus, quand la charge augmente ; chaque cuisine fait travailler ses cuisiniers en threads autour d'un stock qui se recharge, et tout communique par tubes nommés avec notre propre protocole binaire."
