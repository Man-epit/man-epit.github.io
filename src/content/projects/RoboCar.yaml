summary:
  en: "Control software for an RC car on an NVIDIA Jetson: gamepad input, ramped throttle and steering sent over UART to the motor controller, and a mode launcher that starts at boot."
  fr: "Logiciel de contrôle d'une voiture RC sur NVIDIA Jetson : entrée manette, accélération et direction lissées envoyées en UART au contrôleur moteur, et lanceur de modes au démarrage."
role:
  en: Embedded developer
  fr: Développeur embarqué
team:
  en: Réunion campus team
  fr: Équipe du campus Réunion
context:
  en: Epitech Robocar programme, 15 campuses
  fr: Programme Robocar d'Epitech, 15 campus
contextText:
  en: "Robocar is a national Epitech programme: each campus builds a small autonomous car and races it on a track. Our campus team works on the whole chain, from motor control to driving models."
  fr: "Robocar est un programme national d'Epitech : chaque campus construit une petite voiture autonome et la fait courir sur circuit. Notre équipe travaille sur toute la chaîne, du contrôle moteur aux modèles de conduite."
contributions:
  en:
    - Read gamepad input with libevdev and ramp throttle and steering for smooth control
    - Send commands over UART (termios) to the VESC motor controller through my own wesc library
    - Boot-time launcher (Bash + systemd) to pick the driving mode without a screen
    - Trained driving models in a Unity simulator first (Robocar Racing Simulator)
    - Demoed the car at the Préfecture de La Réunion on 14 July 2026
  fr:
    - Lecture de la manette avec libevdev et rampes d'accélération et de direction pour un pilotage fluide
    - Envoi des commandes en UART (termios) au contrôleur VESC via ma bibliothèque wesc
    - Lanceur au démarrage (Bash + systemd) pour choisir le mode de conduite sans écran
    - Entraînement des modèles de conduite d'abord dans un simulateur Unity (Robocar Racing Simulator)
    - Démonstration à la Préfecture de La Réunion le 14 juillet 2026
