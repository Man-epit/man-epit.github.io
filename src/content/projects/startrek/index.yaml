summary:
  en: Deep Q-Network written from scratch that learns to land in Gymnasium's LunarLander, with YAML configs, baselines and multi-seed experiments. Reaches an average return of about 240.
  fr: Deep Q-Network écrit de zéro qui apprend à atterrir dans LunarLander (Gymnasium), avec configs YAML, baselines et expériences multi-seeds. Atteint un retour moyen d'environ 240.
