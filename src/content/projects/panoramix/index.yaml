summary:
  en: "The classic producer–consumer problem, Asterix style: villagers keep drinking from a shared pot of magic potion while the druid refills it, and nobody may drink from an empty pot or refill a full one. Solved with threads, a mutex and semaphores, and tested across many configurations to rule out deadlocks."
  fr: "Le problème classique du producteur-consommateur, version Astérix : les villageois boivent dans une marmite de potion magique partagée pendant que le druide la remplit, et personne ne doit boire dans une marmite vide ni remplir une marmite pleine. Résolu avec des threads, un mutex et des sémaphores, et testé sur de nombreuses configurations pour écarter tout interblocage."
