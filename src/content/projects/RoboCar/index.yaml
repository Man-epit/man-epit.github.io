summary:
  en: "Self-driving RC car built for Epitech's national RoboCar programme: an OAK-D Lite camera on an NVIDIA Jetson Nano drives the car through an AI model or a lighter ray-based algorithm, and our own motor-controller library written in C."
  fr: "Voiture RC autonome réalisée pour le programme national RoboCar d'Epitech : une caméra OAK-D Lite sur une NVIDIA Jetson Nano pilote la voiture via un modèle d'IA ou un algorithme à rayons plus léger, et notre propre bibliothèque de contrôle moteur écrite en C."
