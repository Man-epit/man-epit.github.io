summary:
  en: "A small car that drives itself, built by our campus team for Epitech's national RoboCar race, and 3rd at the final in Paris. It sees the track through a single camera and decides on its own, with an AI model for tricky turns or a lighter algorithm when every bit of computing power counts."
  fr: "Une petite voiture qui conduit seule, construite par l'équipe de notre campus pour la course nationale RoboCar d'Epitech, et 3e de la finale à Paris. Elle voit la piste à travers une seule caméra et décide seule, avec un modèle d'IA pour les virages difficiles ou un algorithme plus léger quand chaque ressource compte."
role:
  en: Embedded developer
  fr: Développeur embarqué
team:
  en: 6 people
  fr: 6 personnes
context:
  en: Epitech RoboCar programme, one team per campus
  fr: Programme RoboCar d'Epitech, une équipe par campus
contextText:
  en: "RoboCar started as a challenge from UTAC to Epitech students. Each campus enters one team, which builds a self-driving car and races it against the other campuses."
  fr: "RoboCar est né d'un défi lancé par l'UTAC aux étudiants d'Epitech. Chaque campus engage une équipe, qui construit une voiture autonome et l'affronte en course face aux autres campus."
contributions:
  en:
    - "Two driving modes from the same camera: an image-recognition model trained with supervised learning, more resilient in complex turns, and a ray-casting algorithm on the camera's output that uses far fewer resources"
    - Decision algorithms written in C that turn the camera analysis into throttle and steering
    - "Our own ESC library in C (wesc): a rewrite of the VESC UART protocol for better performance than the standard tooling, soon to be open-sourced"
    - "Hardware integration: NVIDIA Jetson Nano, OAK-D Lite camera, VESC electronic speed controller and steering servo"
  fr:
    - "Deux modes de conduite à partir de la même caméra : un modèle de reconnaissance d'images entraîné en apprentissage supervisé, plus robuste dans les virages complexes, et un algorithme de lancer de rayons sur la sortie de la caméra, bien moins gourmand en ressources"
    - Algorithmes de décision écrits en C qui transforment l'analyse de la caméra en accélération et direction
    - "Notre propre bibliothèque ESC en C (wesc) : une réécriture du protocole UART du VESC, plus performante que l'outillage standard, bientôt open source"
    - "Intégration matérielle : NVIDIA Jetson Nano, caméra OAK-D Lite, variateur VESC et servo de direction"
