slug: 42sh
title: 42sh
categories: [sys]
year: "2025"
status: done
featured: false
order: 155
summary:
  en: "We rebuilt the Unix shell developers type into all day: a tcsh-compatible shell in C that turns each command line into a syntax tree and runs it, with pipes, redirections, subshells, variables, aliases, history and background jobs, checked output for output against the real tcsh."
  fr: "Nous avons recréé le shell Unix que les développeurs utilisent toute la journée : un shell compatible tcsh en C qui transforme chaque ligne de commande en arbre syntaxique et l'exécute, avec pipes, redirections, sous-shells, variables, alias, historique et jobs en arrière-plan, vérifié sortie par sortie face au vrai tcsh."
team:
  en: 4 people
  fr: 4 personnes
context:
  en: Epitech project, 1st year
  fr: Projet Epitech, 1re année
contextText:
  en: "Epitech's 1st-year Unix programming project: write a shell that behaves like tcsh, with the same output, error messages and exit codes, using only system calls such as fork, execve, pipe and dup2."
  fr: "Projet de programmation Unix de 1re année à Epitech : écrire un shell qui se comporte comme tcsh, avec la même sortie, les mêmes messages d'erreur et les mêmes codes de retour, en n'utilisant que des appels système comme fork, execve, pipe et dup2."
contributions:
  en:
    - "Parser that builds a syntax tree by operator precedence: ; and background jobs, then ||, &&, redirections, pipes and parenthesised subshells"
    - "Expansion of $variables and $?, `command` substitution, aliases, !N history and *?[ ] globbing"
    - "Built-ins: cd, env, setenv, unsetenv, set, unset, alias, unalias, which, where, repeat, history, jobs, fg, exit"
    - "Job control with process groups, and a test script that compares every case with tcsh"
  fr:
    - "Parseur qui construit un arbre syntaxique selon la priorité des opérateurs : ; et jobs en arrière-plan, puis ||, &&, redirections, pipes et sous-shells entre parenthèses"
    - "Expansion des $variables et de $?, substitution `commande`, alias, historique !N et globbing *?[ ]"
    - "Builtins : cd, env, setenv, unsetenv, set, unset, alias, unalias, which, where, repeat, history, jobs, fg, exit"
    - "Contrôle des jobs par groupes de processus, et un script de test qui compare chaque cas avec tcsh"
