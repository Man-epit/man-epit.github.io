summary:
  en: "A file server that any standard FTP client can connect to, written from scratch on raw sockets: many users at once on a single thread, uploads and downloads, and every user locked inside their own folder so nobody can reach the rest of the disk."
  fr: "Un serveur de fichiers auquel n'importe quel client FTP standard peut se connecter, écrit de zéro sur des sockets bruts : plusieurs utilisateurs à la fois sur un seul thread, envoi et téléchargement de fichiers, et chaque utilisateur enfermé dans son propre dossier pour que personne n'accède au reste du disque."
