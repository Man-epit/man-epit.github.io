summary:
  en: "Getting a crowd of robots through a maze as fast as possible: the program reads a network of rooms and tunnels, finds the shortest routes, and spreads the robots across them so that no two ever share a room, a small version of the traffic and routing problems real networks face."
  fr: "Faire traverser un labyrinthe à une foule de robots le plus vite possible : le programme lit un réseau de salles et de tunnels, trouve les chemins les plus courts et y répartit les robots pour que deux d'entre eux ne partagent jamais une salle, une version miniature des problèmes de trafic et de routage des vrais réseaux."
