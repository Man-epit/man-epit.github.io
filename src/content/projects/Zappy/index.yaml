  fr: Projet de fin de 2e année
contextText:
  en: "Epitech's end-of-2nd-year project, one month for a team of six. Behind it is a question that matters more and more in AI: letting agents learn and evolve in a simulation before they act in the real world. The challenge was to design an architecture solid enough to run that simulation, with every component following the same strict protocol."
  fr: "Projet de fin de 2e année d'Epitech, un mois pour une équipe de six. Derrière, une question de plus en plus centrale en IA : laisser des agents apprendre et évoluer dans une simulation avant d'agir dans le monde réel. Le défi était de concevoir une architecture assez solide pour faire tourner cette simulation, avec des composants qui respectent tous le même protocole strict."
contributions:
  en:
    - "Simulation server in C++20: a single-threaded event loop on poll(), a command queue per agent, time-scaled actions, every rule of the world enforced on the server side, and a written protocol specification (RFC)"
    - "Graphical client in C++ with OpenGL (GLFW) that follows the simulation live"
    - "Autonomous AI agents in Python: each one perceives its surroundings, decides on its own and coordinates with the others by broadcasting messages"
    - "Bridge (bonus): a client that keeps a cached copy of the server state and serves it over HTTP, so any number of extra clients can follow the simulation without loading the server. It connected a Meta Quest 2 showing the world in augmented reality, and a web app for phone and PC"
    - "LLM agents (bonus): language models connected through an API, with a personality system that shapes how each agent acts in the world"
    - "A test server to try agents in isolation"
  fr:
    - "Serveur de simulation en C++20 : boucle d'événements mono-thread sur poll(), une file de commandes par agent, actions cadencées dans le temps, toutes les règles du monde appliquées côté serveur, et une spécification écrite du protocole (RFC)"
    - "Client graphique en C++ avec OpenGL (GLFW) qui suit la simulation en direct"
    - "Agents IA autonomes en Python : chacun perçoit son environnement, décide seul et se coordonne avec les autres en diffusant des messages"
    - "Bridge (bonus) : un client qui garde en cache l'état du serveur et le sert en HTTP, pour que n'importe quel nombre de clients supplémentaires suive la simulation sans charger le serveur. Il a permis de connecter un Meta Quest 2 affichant le monde en réalité augmentée, et une application web pour téléphone et PC"
    - "Agents LLM (bonus) : des modèles de langage connectés via une API, avec un système de personnalités qui façonne la manière dont chaque agent agit dans le monde"
    - "Un serveur de test pour essayer les agents isolément"
