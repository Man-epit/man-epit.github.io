- id: president-student-union-bde
  role:
    en: President, Student Union (BDE)
    fr: Président du BDE
  when:
    en: 2025 – now
    fr: 2025 – auj.
  text:
    en: Two consecutive terms leading a team of 20+ and managing the budget. First term: restructured the association into 5 divisions (communication, treasury, development, logistics, events). Second term: a record 20+ events in the year, partnerships with local businesses and new internal management tools.
    fr: Deux mandats consécutifs à la tête d'une équipe de plus de 20 personnes, avec la gestion du budget. 1er mandat : restructuration de l'association en 5 pôles (communication, trésorerie, développement, logistique, événementiel). 2nd mandat : plus de 20 événements dans l'année, un record, des partenariats avec des commerces locaux et de nouveaux outils internes de gestion.
