summary:
  en: "C has no garbage collector, so I wrote one: it finds the memory a program still uses by scanning the stack for anything that looks like a pointer, follows those pointers through the heap, and frees everything left unreached, with no change to the program's code."
  fr: "Le C n'a pas de ramasse-miettes, alors j'en ai écrit un : il retrouve la mémoire encore utilisée en parcourant la pile à la recherche de tout ce qui ressemble à un pointeur, suit ces pointeurs à travers le tas, et libère tout ce qui n'est plus atteignable, sans modifier le code du programme."
