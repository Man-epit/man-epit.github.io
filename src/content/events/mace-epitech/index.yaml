summary:
  en: "SOMIN (\"the path\" in Réunion Creole): an app that turns hotel buffet guests into engaged tourists by putting local produce first and cutting food waste, backed by an AI-powered connected bin."
  fr: "SOMIN (« le chemin » en créole) : une application qui transforme les clients des buffets d'hôtel en touristes engagés, en remettant le terroir réunionnais au centre de l'assiette et en réduisant le gaspillage, avec une poubelle connectée analysée par IA."
contextText:
  en: "First edition of the hackathon run by Epitech La Réunion and Groupe Macé. The brief, from the group's hotel division: how can technology turn a consumer tourist into an engaged tourist? The team started from one figure: global food waste emits four times more CO₂ than global air traffic."
  fr: "Première édition du hackathon organisé par Epitech La Réunion et le Groupe Macé. Le défi, posé par le pôle hôtelier du groupe : comment la technologie peut-elle transformer un touriste consommateur en touriste engagé ? L'équipe est partie d'un constat : le gaspillage alimentaire mondial émet quatre fois plus de CO₂ que le trafic aérien mondial."
contributions:
  en:
    - "Local food guide: a QR code on each table opens the app, which tells the story of the local produce and the chef's recipes."
    - "\"Somin\" tasting: the app suggests ideal portions (e.g. \"3 spoons of pitaya\") so guests can taste every local dish without overloading their plate."
    - "Connected bin: an AI analyses leftovers so kitchens can plan quantities better and favour local purchases."
  fr:
    - "Guide du terroir : un QR code à table ouvre l'application, qui raconte l'histoire des produits péi et des recettes du chef."
    - "Dégustation « Somin » : l'application suggère des portions idéales (ex. « 3 cuillères de pitaya ») pour goûter à toutes les saveurs locales sans surcharger son assiette."
    - "Poubelle connectée : une IA analyse les restes pour aider les cuisines à mieux prévoir les quantités et privilégier les achats locaux."
