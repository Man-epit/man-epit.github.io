summary:
  en: "Programs fighting for control of a shared memory: we wrote the virtual machine that runs these battles, with its own instruction set and processes that fork, a shell to step through the fight, and a live 3D view of the memory, all the way to a VR headset. First of our campus."
  fr: "Des programmes qui se battent pour le contrôle d'une mémoire partagée : nous avons écrit la machine virtuelle qui fait tourner ces combats, avec son jeu d'instructions et des processus qui se dupliquent, un shell pour avancer pas à pas, et une vue 3D en direct de la mémoire, jusque dans un casque VR. Premiers du campus."
